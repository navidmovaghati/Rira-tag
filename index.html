<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ری‌را ⭐</title>

  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Vazirmatn", Tahoma, sans-serif;

      background:
        radial-gradient(circle at top right, #ffe5ee 0, transparent 35%),
        radial-gradient(circle at bottom left, #fff0c7 0, transparent 35%),
        #fffaf7;

      color: #3d3540;
      direction: rtl;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    .card {
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      padding: 32px 22px 26px;

      text-align: center;

      box-shadow:
        0 12px 40px rgba(120, 80, 100, 0.12);

      border: 1px solid rgba(255,255,255,0.8);
    }

    .star {
      width: 90px;
      height: 90px;

      margin: 0 auto 14px;

      border-radius: 50%;

      background: #fff3c7;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 50px;

      box-shadow:
        0 8px 20px rgba(234, 190, 65, 0.18);
    }

    .hello {
      font-size: 16px;
      font-weight: 600;
      color: #8b7480;
      margin-bottom: 2px;
    }

    h1 {
      margin: 0 0 10px;

      font-family: "Lalezar", "Vazirmatn", sans-serif;

      font-size: 42px;
      font-weight: 400;

      color: #d45a83;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 19px;
      font-weight: 700;

      color: #6f5864;

      margin-bottom: 12px;
    }

    .message {
      font-size: 16px;
      font-weight: 500;

      line-height: 2.1;

      color: #6c6268;

      background: #fff7fa;

      border-radius: 18px;

      padding: 16px;

      margin: 20px 0 25px;
    }

    .btn {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      border: none;
      text-decoration: none;
      cursor: pointer;

      margin: 11px 0;

      padding: 16px;

      border-radius: 16px;

      font-family: "Vazirmatn", sans-serif;

      font-size: 17px;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .mom {
      background: #f8c7d8;
      color: #5d3444;
    }

    .dad {
      background: #e5e3f8;
      color: #453f68;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .location {
      background: #5b8def;
      color: white;
    }

    .footer {
      font-family: "Vazirmatn", sans-serif;

      margin-top: 24px;

      color: #9a8790;

      font-size: 14px;
      font-weight: 500;

      line-height: 1.8;
    }

    .heart {
      font-size: 20px;
      margin-bottom: 4px;
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="card">

      <div class="star">
        ⭐
      </div>

      <div class="hello">
        سلام! 👋
      </div>

      <h1>
        من ری‌را هستم
      </h1>

      <div class="subtitle">
        ممکن است به کمک شما نیاز داشته باشم
      </div>

      <div class="message">
        اگر من را پیدا کرده‌اید،
        لطفاً با مامان یا بابای من تماس بگیرید.
        <br>
        اگر امکان دارد، موقعیت مکانی خودتان را هم
        برای خانواده‌ام ارسال کنید.
      </div>


      <a
        class="btn mom"
        href="tel:+989112187591">
        📞 تماس با مامان
      </a>


      <a
        class="btn dad"
        href="tel:+989112112596">
        📞 تماس با بابا
      </a>


      <button
        class="btn whatsapp"
        onclick="sendWhatsApp()">
        💬 پیام به مامان در واتساپ
      </button>


      <button
        class="btn location"
        onclick="sendLocation()">
        📍 ارسال موقعیت مکانی من
      </button>


      <div class="footer">
        <div class="heart">❤️</div>
        ممنون که به من کمک می‌کنید
      </div>

    </div>

  </div>


<script>

  const childName = "ری‌را";

  const whatsappNumber = "989112187591";


  function sendWhatsApp() {

    const message =
      `سلام، من ${childName} را پیدا کرده‌ام و می‌خواستم به شما اطلاع بدهم.`;

    const whatsappURL =
      `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

    window.location.href = whatsappURL;
  }


  function sendLocation() {

    if (!navigator.geolocation) {

      alert(
        "گوشی شما قابلیت دریافت موقعیت مکانی را پشتیبانی نمی‌کند."
      );

      return;
    }


    const locationButton =
      document.querySelector(".location");

    const originalText =
      locationButton.innerHTML;

    locationButton.innerHTML =
      "⏳ در حال دریافت موقعیت...";

    locationButton.disabled = true;


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        const mapsLink =
          `https://maps.google.com/?q=${latitude},${longitude}`;


        const message =
`سلام، من ${childName} را پیدا کرده‌ام.

موقعیت مکانی فعلی من:

${mapsLink}`;


        const whatsappURL =
          `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;


        locationButton.innerHTML =
          originalText;

        locationButton.disabled =
          false;


        window.location.href =
          whatsappURL;

      },


      function() {

        locationButton.innerHTML =
          originalText;

        locationButton.disabled =
          false;


        alert(
          "نتوانستم موقعیت مکانی را دریافت کنم.\n\nلطفاً دسترسی Location را فعال کنید و دوباره امتحان کنید."
        );

      },


      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }

</script>

</body>
</html>
